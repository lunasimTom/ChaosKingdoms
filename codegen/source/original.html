<!--
 Chaos Kingdoms · Cheat Code Generator  (standalone, no link to the game)

 CODE FORMAT (CK3, bound to player name AND issue time) — 20 chars, Crockford Base32 = 100 bits
   P      = effectId(6 bits) << 40 | issueTime(32 bits, unix seconds) << 8 | serial(8 random bits)   (46 bits)
   tag    = HMAC-SHA256(K, "CK3|T|" + id(1B) + time(4B, big-endian) + serial(1B) + "|" + utf8(normName))[0..54 bits)
   mask   = HMAC-SHA256(K, "CK3|M|" + tag[7 bytes, big-endian, 54 bits right-aligned])[0..46 bits)
   code   = (P xor mask)(46 bits) || tag(54 bits)
 normName = NFKC(name) -> collapse whitespace -> trim -> toLowerCase.
 The name is NOT stored in the code; the game recomputes the tag with the CURRENT player name.
 The issue time is hidden in the code (masked); the game decodes it AFTER the tag check passes and
 accepts the code only if  -120s <= (now - issueTime) <= 600s  (10 minutes).
 Single use: the game stores the normalized code in the redeemed list.
 The key K below must be identical in the game's verifier.
-->

  go:'Generate codes',qty:'pcs',none:'Pick an effect above first',picked:'Selected: ',stack:'Stackable',big:'MEGA',emptyRes:'No codes generated yet',emptyHis:'No history yet',
  copy:'Copy',copied:'Copied',copyAll:'Copy all',dl:'Download TXT',csv:'Export CSV',clr:'Clear history',clrQ:'Clear all history? (Codes already issued are not affected.)',cleared:'History cleared',
  foot:'<b>Notes:</b> codes are bound to the player name: a different name yields different codes, and they will not redeem under another name (case and extra spaces are ignored). Every code carries a random serial, so codes for the same effect always differ; 20 chars, contains the issue time, HMAC-SHA256 signed, not guessable. <b>Valid for 10 minutes</b> (judged by the device clock of the player, so keep both clocks roughly in sync). <b>Key fingerprint:</b> '+KEY_FP+' (the game verifier must use the same key). History is stored in this browser only.'}
};
const t=k=>T[LANG][k];
const nm=e=>e[LANG];
let toastT=0;function toast(s){const e=$('toast');e.textContent=s;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),1400)}

function loadHist(){try{return JSON.parse(localStorage.getItem('ck_cheatgen_hist')||'[]')}catch(e){return[]}}
function saveHist(h){try{localStorage.setItem('ck_cheatgen_hist',JSON.stringify(h.slice(-2000)))}catch(e){}}
async function copyText(s){
  try{await navigator.clipboard.writeText(s);return true}catch(e){}
  try{const a=document.createElement('textarea');a.value=s;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();const ok=document.execCommand('copy');a.remove();return ok}catch(e){return false}
}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function renderGroups(){
  $('groups').innerHTML=GROUPS.map(([g,zh,en])=>`<div class="grp"><b class="f">${LANG==='zh'?zh:en}</b><div class="grid" role="radiogroup">${
    EFFECTS.filter(e=>e.g===g).map(e=>`<button type="button" class="opt" role="radio" aria-checked="${sel===e.id}" data-id="${e.id}"><span class="ic">${e.ic}</span><span class="tx">${esc(nm(e))}${e.stack?`<br><span class="tag">${t('stack')}</span>`:''}${e.big?`<br><span class="tag big">${t('big')}</span>`:''}</span></button>`).join('')
  }</div></div>`).join('');
}
function renderSel(){
  const e=EFFECTS.find(x=>x.id===sel);
  $('selTxt').innerHTML=e?t('picked')+'<b>'+esc(nm(e))+'</b>':t('none');
  $('go').disabled=!e;
}
function renderCodes(){
  const c=$('codes');
  if(!last.length){c.innerHTML=`<div class="empty">${t('emptyRes')}</div>`;$('tools').hidden=true;return}
  c.innerHTML=last.map((x,i)=>`<div class="code"><span class="v">${fmt(x.code)}</span><span class="n">${esc(nm(EFFECTS.find(e=>e.id===x.id)))}<br>${t('until')} ${hhmmss(x.ts+CODE_TTL)} · <b class="cd" data-exp="${x.ts+CODE_TTL}"></b></span><button class="bt g" type="button" data-copy="${i}">${t('copy')}</button></div>`).join('');
  $('tools').hidden=false;
}
function renderHist(){
  const h=loadHist().slice().reverse();
  $('hist').innerHTML=h.length?h.map((x,i)=>{const e=EFFECTS.find(z=>z.id===x.id);return `<div class="hrow"><span class="v">${fmt(x.code)}</span><span class="m">${esc(e?nm(e):'#'+x.id)} · 👤${esc(x.player||'-')} · ${new Date(x.at).toLocaleString()}${x.ts?' · '+t('until')+' '+hhmmss(x.ts+CODE_TTL)+' <b class="cd" data-exp="'+(x.ts+CODE_TTL)+'"></b>':''}</span><button class="bt g" type="button" data-hcopy="${esc(x.code)}">${t('copy')}</button></div>`}).join(''):`<div class="empty">${t('emptyHis')}</div>`;
}
function renderText(){
  document.documentElement.lang=LANG==='zh'?'zh-CN':'en';
  $('lang').textContent=t('lang');$('ttl').textContent=t('ttl');$('sub').textContent=t('sub');
  $('h-name').textContent=t('name');$('pname').placeholder=t('nameph');$('h-pick').textContent=t('pick');$('h-gen').textContent=t('gen');$('h-res').textContent=t('res');$('h-his').textContent=t('his');
  $('go').textContent=t('go');$('qlab').textContent=t('qty');$('copyAll').textContent=t('copyAll');$('dlTxt').textContent=t('dl');
  $('dlCsv').textContent=t('csv');$('clr').textContent=t('clr');$('foot').innerHTML=t('foot');document.title=(LANG==='zh'?'混沌王国 · ':'Chaos Kingdoms · ')+t('ttl');
  renderGroups();renderSel();renderCodes();renderHist();renderPlayer();tick();
}
function renderPlayer(){
  const ok=!!player,st=$('pst');
  $('pname').disabled=ok;$('pok').textContent=ok?t('namechg'):t('nameok');
  $('secPick').classList.toggle('locked-off',!ok);$('secGen').classList.toggle('locked-off',!ok);
  if(ok){st.className='pst ok';st.textContent='✓ '+t('nameLocked')+player+t('nameLocked2')}
  else if(pmsg){st.className='pst bad';st.textContent=t(pmsg)}
  else{st.className='pst';st.textContent=t('nameNeed')}
}

function clampQty(){let v=Math.round(+$('qty').value||1);v=Math.max(1,Math.min(50,v));$('qty').value=v;return v}
function generate(){
  if(!sel||!player)return;const n=clampQty();
  const hist=loadHist(),used=new Set(hist.map(x=>x.code)),batch=[],now=Date.now(),ts=Math.floor(now/1000);
  while(batch.length<n){
    const code=makeCode(sel,ts,randByte(),player);
    if(used.has(code))continue;used.add(code);
    batch.push({code,id:sel,at:now,ts,player});
  }
  hist.push(...batch);saveHist(hist);last=batch;renderCodes();renderHist();tick();
}
const hhmmss=sec=>new Date(sec*1000).toLocaleTimeString([],{hour12:false});
function tick(){
  const now=Date.now()/1000;
  document.querySelectorAll('.cd').forEach(el=>{
    const left=Math.ceil(+el.dataset.exp-now);
    if(left>0){el.textContent=t('left')+' '+Math.floor(left/60)+':'+String(left%60).padStart(2,'0');el.style.color=left<=60?'var(--bad)':'var(--ok)'}
    else{el.textContent=t('expired');el.style.color='var(--bad)'}
  });
}
setInterval(tick,1000);

$('groups').addEventListener('click',ev=>{const b=ev.target.closest('.opt');if(!b)return;sel=+b.dataset.id;
  document.querySelectorAll('.opt').forEach(o=>o.setAttribute('aria-checked',String(+o.dataset.id===sel)));renderSel()});
$('qm').onclick=()=>{$('qty').value=clampQty()-1;clampQty()};
$('qp').onclick=()=>{$('qty').value=clampQty()+1;clampQty()};
$('qty').addEventListener('change',clampQty);
$('go').onclick=generate;
$('codes').addEventListener('click',async ev=>{const b=ev.target.closest('[data-copy]');if(!b)return;toast(await copyText(last[+b.dataset.copy].code)?t('copied'):'×')});
$('hist').addEventListener('click',async ev=>{const b=ev.target.closest('[data-hcopy]');if(!b)return;toast(await copyText(b.dataset.hcopy)?t('copied'):'×')});
$('copyAll').onclick=async()=>toast(await copyText(last.map(x=>x.code).join('\n'))?t('copied'):'×');
$('dlTxt').onclick=()=>{const e=EFFECTS.find(x=>x.id===last[0].id);download('ck-codes-'+Date.now()+'.txt',last.map(x=>fmt(x.code)+'\t'+nm(e)+'\t'+x.player+'\t'+new Date((x.ts+CODE_TTL)*1000).toLocaleString()).join('\r\n'),'text/plain')};
$('dlCsv').onclick=()=>{const h=loadHist();download('ck-code-history.csv','code,player,effect_id,effect,generated_at,expires_at\r\n'+h.map(x=>{const e=EFFECTS.find(z=>z.id===x.id);return [x.code,'"'+String(x.player||'').replace(/"/g,'""')+'"',x.id,'"'+(e?e.zh:'')+'"',new Date(x.at).toISOString(),x.ts?new Date((x.ts+CODE_TTL)*1000).toISOString():''].join(',')}).join('\r\n'),'text/csv')};
$('clr').onclick=()=>{if(confirm(t('clrQ'))){saveHist([]);renderHist();toast(t('cleared'))}};
function confirmName(){
  if(player){player=null;last=[];pmsg=null;renderPlayer();renderCodes();$('pname').focus();return}
  const raw=$('pname').value.replace(/\s+/g,' ').trim();
  if(!normName(raw)){pmsg='nameEmpty';renderPlayer();return}
  player=raw;pmsg=null;last=[];renderPlayer();renderCodes();
}
$('pok').onclick=confirmName;
$('pname').addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();if(!player)confirmName()}});
$('lang').onclick=()=>{LANG=LANG==='zh'?'en':'zh';renderText()};

window.__ck={makeCode,EFFECTS,randByte};   // test hook only; read-only helpers, no verifier
renderText();
})();
</script>
</body>
</html>

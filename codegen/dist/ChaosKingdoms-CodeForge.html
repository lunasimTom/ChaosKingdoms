<!--
 Chaos Kingdoms · Cheat Code Generator  (standalone, no link to the game)

 CODE FORMAT (CK3, bound to player name AND issue time) — 20 chars, Crockford Base32 = 100 bits
   P      = effectId(6 bits) << 40 | issueTime(32 bits, unix seconds) << 8 | serial(8 random bits)   (46 bits)
   tag    = HMAC-SHA256(K, "CK3|T|" + id(1B) + time(4B, big-endian) + serial(1B) + "|" + utf8(normName))[0..54 bits)
   mask   = HMAC-SHA256(K, "CK3|M|" + tag[7 bytes, big-endian, 54 bits right-aligned])[0..46 bits)
   code   = (P xor mask)(46 bits) || tag(54 bits)
 normName = NFKC(name) -> collapse whitespace -> trim -> toLowerCase.
 The name is NOT stored in the code; the game recomputes the tag with the CURRENT player name.
 The issue time is hidden in the code (masked); the game decodes it AFTER the tag check passes and
 accepts the code only if  -120s <= (now - issueTime) <= 600s  (10 minutes).
 Single use: the game stores the normalized code in the redeemed list.
 The key K below must be identical in the game's verifier.
-->

  content:"";position:absolute;inset:5px;border:1px solid #e9c77930;border-radius:12px;
  pointer-events:none;
}
h2{
  position:relative;margin:0 0 14px;font-size:15px;letter-spacing:.1em;color:var(--gold2);
  display:flex;align-items:center;gap:10px;text-shadow:0 2px 5px #000;
}
h2:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,#e9c373aa,transparent)}
.grp{margin:0 0 15px}.grp:last-child{margin-bottom:0}
.grp>b{display:block;margin:0 0 8px;font-size:11px;letter-spacing:.15em;color:#e2c47d;text-shadow:0 1px 4px #000}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:9px}
.opt{
  position:relative;display:flex;align-items:center;gap:10px;text-align:left;min-height:58px;
  padding:10px 12px;border-radius:12px;cursor:pointer;
  border:1px solid #7991b5;
  background:linear-gradient(180deg,#315a8c 0%,#173b68 42%,#0c2446 100%);
  color:#f8edcf;font:800 13px/1.3 Nunito,"PingFang SC","Microsoft YaHei",sans-serif;
  box-shadow:inset 0 1px 0 #ffffff55,inset 0 -3px 8px #020b1c99,0 3px 0 #040b18,0 6px 12px #0005;
  transition:transform .14s ease,border-color .14s ease,filter .14s ease,box-shadow .14s ease;
}
.opt:hover{border-color:#ffe6a0;filter:brightness(1.12)}
.opt:active{transform:translateY(2px);box-shadow:inset 0 1px 0 #ffffff44,0 1px 0 #040b18}
.opt .ic{
  flex:none;width:35px;height:35px;display:grid;place-items:center;font-size:19px;border-radius:50%;
  background:radial-gradient(circle at 35% 25%,#6685b2,#203c68 58%,#102343);
  border:1px solid #f6d98a;box-shadow:inset 0 1px 3px #fff5,0 2px 5px #0009;
}
.opt .tx{flex:1;min-width:0}
.opt .tag{display:inline-block;margin-top:4px;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:900;color:#08202b;background:linear-gradient(180deg,#a5f0f0,#45b7c9);box-shadow:0 1px 3px #0006}
.opt .tag.big{background:linear-gradient(180deg,#fff0a9,#e5a936);color:#352000}
.opt[aria-checked="true"]{
  border-color:#fff0ad;
  background:linear-gradient(180deg,#72501d 0%,#47300f 45%,#241907 100%);
  box-shadow:inset 0 1px 0 #fff7,0 0 0 1px #f3ce6c88,0 0 18px #e9b94955,0 3px 0 #080d19;
}
.opt[aria-checked="true"]:after{
  content:"✓";position:absolute;right:9px;top:6px;color:#fff0ad;font-size:14px;text-shadow:0 1px 4px #000;
}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.pn{
  flex:1;min-width:180px;padding:12px 14px;border-radius:11px;
  border:1px solid #7891b8;background:linear-gradient(180deg,#06152b,#0d2341);
  color:#fff;font:900 16px Nunito,"PingFang SC","Microsoft YaHei",sans-serif;outline:0;
  box-shadow:inset 0 3px 8px #0009,0 1px 0 #ffffff18;
}
.pn:focus{border-color:var(--gold2);box-shadow:0 0 0 3px #f0c04e2c,inset 0 3px 8px #0009}
.pn[disabled]{color:var(--gold2);border-color:#9b7837;background:#1d1b16}
.pst{margin:10px 0 0;font-size:12px;color:var(--mut);line-height:1.5}.pst.ok{color:var(--ok)}.pst.bad{color:var(--bad)}
.locked-off{opacity:.42;filter:grayscale(.55);pointer-events:none}
.qty{
  display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:11px;
  border:1px solid #627fa8;background:linear-gradient(180deg,#102b4c,#07172d);
  box-shadow:inset 0 1px #fff2,0 3px 8px #0005;
}
.qty button{
  width:30px;height:30px;border-radius:8px;border:1px solid #e2bd69;
  background:linear-gradient(180deg,#315786,#132e50);color:#fff0bd;
  font:900 18px Nunito,sans-serif;cursor:pointer;box-shadow:inset 0 1px #fff4,0 2px 4px #0008;
}
.qty input{width:42px;text-align:center;background:transparent;border:0;color:#fff;font:900 16px Nunito,sans-serif;outline:0}
.qty span{font-size:12px;color:var(--mut)}
.sel{flex:1;min-width:150px;font-size:13px;color:var(--mut);line-height:1.5}
.sel b{color:var(--gold2)}
.bt{
  padding:12px 22px;border-radius:11px;border:1px solid #fff0b0;cursor:pointer;
  font:900 15px Nunito,"PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:.08em;color:#382207;
  background:linear-gradient(180deg,#fff0a6 0%,#edc15b 48%,#a96e20 100%);
  box-shadow:inset 0 1px 0 #fff9,0 3px 0 #684316,0 7px 14px #0008;
  transition:transform .12s ease,filter .12s ease;
}
.bt:hover{filter:brightness(1.08)}.bt:active{transform:translateY(2px);box-shadow:inset 0 1px #fff8,0 1px 0 #684316}
.bt[disabled]{opacity:.45;filter:grayscale(.6);cursor:not-allowed}
.bt.g{
  padding:8px 14px;font-size:12px;letter-spacing:.035em;color:#f3e8c8;border:1px solid #7993b8;
  background:linear-gradient(180deg,#315985,#142f52 60%,#0c1e37);
  box-shadow:inset 0 1px #fff3,0 2px 0 #050c19,0 4px 8px #0005;
}
.codes{display:grid;gap:9px}
.code{
  display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:11px;
  border:1px solid #a37a37;background:linear-gradient(145deg,#1c2e47,#101c30 55%,#0a1425);
  box-shadow:inset 0 1px #fff2,0 3px 8px #0005;animation:pop .25s ease-out;
}
@keyframes pop{from{transform:translateY(5px);opacity:0}to{transform:none;opacity:1}}
.code .v{
  flex:1;min-width:0;font:900 clamp(15px,4.4vw,21px) ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  letter-spacing:.07em;color:#ffe6a0;text-shadow:0 0 10px #f0c04e55;word-break:break-all;
}
.code .n{font-size:11px;color:#b7c4d8;white-space:nowrap;line-height:1.6}
.empty{
  padding:20px 14px;text-align:center;color:#aab8ce;font-size:13px;
  border:1px dashed #657da2;border-radius:11px;background:#07152a88;
}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.hist{max-height:300px;overflow:auto;display:grid;gap:7px;padding:2px 3px 2px 0;overscroll-behavior:contain}
.hrow{
  display:grid;grid-template-columns:1fr auto;gap:3px 10px;padding:9px 11px;border-radius:10px;
  background:linear-gradient(145deg,#102542,#09172b);border:1px solid #334f74;
}
.hrow .v{font:800 13px ui-monospace,Menlo,Consolas,monospace;color:#ffe291;letter-spacing:.05em;word-break:break-all}
.hrow .m{font-size:11px;color:#aab8ce;line-height:1.5;overflow-wrap:anywhere}
.hrow button{grid-row:1/3;grid-column:2;align-self:center}
.foot{margin:8px 0 0;font-size:11px;line-height:1.8;color:#aab8ce}
.foot b{color:#f1d38b}
.toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
  opacity:0;pointer-events:none;padding:10px 18px;border-radius:999px;
  background:linear-gradient(180deg,#1b3555,#0a1a30);border:1px solid var(--line);
  color:var(--gold2);font-size:13px;transition:.25s;z-index:9;box-shadow:0 5px 20px #0009;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:520px){
  body{padding-left:11px;padding-right:11px}
  header{padding:150px 6px 20px}
  header:before{width:calc(100% + 22px);height:144px;border-radius:14px}
  header:after{top:128px;width:96%;height:80px}
  .lang{right:7px;top:8px}
  .grid{grid-template-columns:1fr 1fr;gap:7px}
  .opt{padding:9px 8px;gap:7px;min-height:58px;font-size:12px}
  .opt .ic{width:30px;height:30px;font-size:16px}
  .bt:not(.g){width:100%}
  .code{flex-wrap:wrap}.code .v{flex:1 1 100%}.code .n{flex:1;white-space:normal}
}
@media(max-width:360px){.grid{grid-template-columns:1fr}.glass{padding:13px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}

<style id="ck-luxury">
/* =====================================================================
   CHAOS KINGDOMS · CODE FORGE — luxury presentation layer
   Styling only: loaded after the original stylesheet, no markup or logic changes.
   ===================================================================== */
:root{
  --onyx0:#050506;--onyx1:#0c0b0e;--onyx2:#15131a;--onyx3:#1d1a22;
  --au1:#fff6d6;--au2:#f4d58a;--au3:#d4a849;--au4:#9c6f22;--au5:#5a3c10;
  --champ:#efe2c2;--smoke:#9a937f;--ruby:#ff6b7f;--jade:#8fe0a8;
  --foil:linear-gradient(115deg,#7a5418 0%,#f6dd96 18%,#b98a33 34%,#fff4cf 50%,#c4943c 66%,#f2d27f 82%,#7a5418 100%);
  --ink:var(--champ);--mut:var(--smoke);--gold2:var(--au2);--ok:var(--jade);--bad:var(--ruby);--line:var(--au3);
}
html{background:#050506}
body{
  color:var(--champ);
  background:
    radial-gradient(ellipse 120% 70% at 50% -10%,#3a2c1266 0,transparent 55%),
    radial-gradient(ellipse 80% 60% at 110% 60%,#2a1f0d40 0,transparent 60%),
    radial-gradient(ellipse 80% 60% at -10% 90%,#1f1a2a55 0,transparent 60%),
    repeating-linear-gradient(135deg,#ffffff04 0 1px,transparent 1px 7px),
    linear-gradient(180deg,#0e0c10 0%,#08070a 50%,#050506 100%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:radial-gradient(ellipse at 50% 40%,transparent 55%,#000000b0 100%);
}
::selection{background:#d4a84966;color:#fff}

/* ---------- header: framed artwork + engraved title plaque ---------- */
header:before{
  border:1px solid transparent!important;
  box-shadow:0 0 0 1px #00000099,0 0 0 2px #d4a84988,0 0 0 4px #050506,0 0 0 5px #9c6f2266,0 18px 40px #000d!important;
  filter:saturate(1.05) contrast(1.05);
}
header:after{
  background:linear-gradient(180deg,#121014f2,#08070af7)!important;
  border:1px solid transparent!important;
  background-clip:padding-box!important;
  box-shadow:0 0 0 1px #d4a849aa,0 0 0 3px #050506,0 0 0 4px #9c6f2255,0 14px 30px #000c,inset 0 1px 0 #fff2!important;
}
header .kick{
  letter-spacing:.5em;color:var(--au2);font-size:10px;padding-left:.5em;
  text-shadow:0 0 12px #d4a84966,0 2px 3px #000;
}
header .kick:before,header .kick:after{content:"";display:inline-block;width:26px;height:1px;vertical-align:middle;margin:0 10px;background:linear-gradient(90deg,transparent,#d4a849)}
header .kick:after{background:linear-gradient(90deg,#d4a849,transparent)}
header h1{
  background:var(--foil);background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  letter-spacing:.09em;
  filter:drop-shadow(0 1px 0 #2a1a05) drop-shadow(0 4px 10px #000);
  animation:lxFoil 7s ease-in-out infinite;
}
@keyframes lxFoil{0%,100%{background-position:0% 0}50%{background-position:100% 0}}
header p{color:#c9bfa6}
.lang{
  border:1px solid transparent!important;
  background:linear-gradient(180deg,#1a171d,#0b0a0d) padding-box,var(--foil) border-box!important;
  color:var(--au2)!important;letter-spacing:.06em;
  box-shadow:0 4px 12px #000b,inset 0 1px 0 #fff2!important;
}

/* ---------- panels: black lacquer with gold-foil frame ---------- */
.glass{
  border:1px solid transparent;border-radius:18px;
  background:
    radial-gradient(ellipse 90% 60% at 50% -20%,#d4a8491a,transparent 60%) padding-box,
    linear-gradient(170deg,#1a171e 0%,#100e13 45%,#09080b 100%) padding-box,
    var(--foil) border-box;
  box-shadow:0 0 0 1px #00000080,inset 0 1px 0 #ffffff14,inset 0 -24px 40px #0000008c,0 18px 40px #000c;
}
.glass:before{border:1px solid #d4a84926;border-radius:13px;inset:6px}
.glass:after{
  content:"";position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:44px;height:3px;border-radius:0 0 3px 3px;
  background:var(--foil);box-shadow:0 0 10px #f4d58a88;
}
h2{color:var(--au2);letter-spacing:.18em;text-transform:uppercase;font-size:14px}
h2:before{content:"◆";font-size:9px;color:var(--au3);text-shadow:0 0 8px #d4a849}
h2:after{background:linear-gradient(90deg,#d4a849aa,#d4a84922 60%,transparent)}
.grp>b{color:var(--au3);letter-spacing:.24em;text-transform:uppercase;font-size:10.5px}

/* ---------- effect cards: obsidian tiles, gold-leaf when chosen ---------- */
.opt{
  border:1px solid #3a3326;
  background:linear-gradient(180deg,#1f1c24 0%,#151319 55%,#0e0d11 100%);
  color:var(--champ);
  box-shadow:inset 0 1px 0 #ffffff12,inset 0 -6px 12px #00000080,0 2px 0 #000,0 6px 14px #0008;
}
.opt:hover{border-color:#b98a33;filter:none;background:linear-gradient(180deg,#26222b 0%,#18161c 55%,#100f13 100%)}
.opt .ic{
  background:radial-gradient(circle at 35% 25%,#3d3628,#17140f 62%,#0b0a08);
  border:1px solid transparent;
  background-clip:padding-box;
  box-shadow:0 0 0 1px #d4a849aa,inset 0 1px 3px #fff3,0 3px 6px #000c;
}
.opt .tag{background:linear-gradient(180deg,#d9f3ec,#7fc7b6);color:#08241d}
.opt .tag.big{background:var(--foil);background-size:200% 100%;color:#2a1a05}
.opt[aria-checked="true"]{
  border-color:transparent;
  background:
    linear-gradient(180deg,#3a2c12 0%,#241b0b 50%,#140f06 100%) padding-box,
    var(--foil) border-box;
  border:1px solid transparent;
  box-shadow:0 0 0 1px #00000080,0 0 22px #d4a84966,inset 0 1px 0 #fff5,inset 0 0 18px #d4a84933,0 3px 0 #000;
}
.opt[aria-checked="true"] .ic{box-shadow:0 0 0 1px #fff0b0,0 0 12px #f4d58a99,inset 0 1px 3px #fff5}
.opt[aria-checked="true"]:after{color:var(--au1);text-shadow:0 0 8px #f4d58a}

/* ---------- inputs ---------- */
.pn{
  border:1px solid #4a4030;background:linear-gradient(180deg,#07070a,#121016);
  color:#fff7e0;letter-spacing:.03em;
  box-shadow:inset 0 3px 10px #000c,0 1px 0 #ffffff10;
}
.pn::placeholder{color:#7d7563}
.pn:focus{border-color:var(--au3);box-shadow:0 0 0 3px #d4a8492e,inset 0 3px 10px #000c}
.pn[disabled]{color:var(--au2);border-color:#9c6f22;background:linear-gradient(180deg,#17130a,#0d0b07)}
.qty{border:1px solid #4a4030;background:linear-gradient(180deg,#141217,#0a090c)}
.qty button{
  border:1px solid transparent;
  background:linear-gradient(180deg,#2a2530,#141217) padding-box,var(--foil) border-box;
  color:var(--au2);
}
.sel b{color:var(--au2)}

/* ---------- buttons: polished gold bar with a passing sheen ---------- */
.bt{
  position:relative;overflow:hidden;isolation:isolate;
  border:1px solid #fff2c4;color:#2a1a05;letter-spacing:.14em;text-transform:uppercase;
  background:linear-gradient(180deg,#fff6d2 0%,#f4d58a 30%,#d4a849 62%,#9c6f22 100%);
  box-shadow:inset 0 1px 0 #fff,inset 0 -2px 0 #7a541888,0 3px 0 #4a3010,0 10px 22px #000c,0 0 18px #d4a84933;
  text-shadow:0 1px 0 #fff6;
}
.bt:not([disabled]):after{
  content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(110deg,transparent 35%,#ffffffaa 50%,transparent 65%);background-size:250% 100%;background-position:150% 0;
  animation:lxSheen 4.2s ease-in-out infinite;
}
@keyframes lxSheen{0%,62%{background-position:150% 0}100%{background-position:-60% 0}}
.bt.g{
  text-transform:none;letter-spacing:.05em;color:var(--au2);text-shadow:none;
  border:1px solid transparent;
  background:linear-gradient(180deg,#25212a,#131116 60%,#0b0a0d) padding-box,linear-gradient(140deg,#9c6f22,#f4d58a 50%,#9c6f22) border-box;
  box-shadow:inset 0 1px 0 #ffffff1a,0 2px 0 #000,0 6px 12px #0008;
}
.bt.g:after{display:none}

/* ---------- generated codes: engraved gold plaques ---------- */
.code{
  border:1px solid transparent;border-radius:12px;
  background:linear-gradient(145deg,#1c1810,#110e09 55%,#0a0806) padding-box,var(--foil) border-box;
  box-shadow:inset 0 1px 0 #fff2,inset 0 0 22px #d4a8491a,0 6px 16px #000b;
}
.code .v{
  background:linear-gradient(180deg,#fff6d6,#f4d58a 45%,#c4943c);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:none;filter:drop-shadow(0 0 8px #d4a84955) drop-shadow(0 1px 0 #2a1a05);letter-spacing:.12em;
}
.code .n{color:#bfb59c}
.empty{border:1px dashed #6a5a3a;background:#0b0a0d99;color:#9a937f}
.hrow{background:linear-gradient(145deg,#16141a,#0c0b0e);border:1px solid #3a3326}
.hrow .v{color:var(--au2)}
.hrow .m{color:#a39b86}
.hist::-webkit-scrollbar{width:6px}.hist::-webkit-scrollbar-thumb{background:linear-gradient(#f4d58a,#9c6f22);border-radius:9px}

<body>
<div class="wrap">
  <header>
    <button class="lang" id="lang" type="button">🌐 中文</button>
    <div class="kick f">CHAOS KINGDOMS</div>
    <h1 class="f" id="ttl">作弊码生成器</h1>
    <p id="sub">选择效果 → 设定数量 → 生成。每个码仅可使用一次。</p>
  </header>

  <section class="glass">
    <h2 class="f" id="h-name">玩家名</h2>
    <div class="row"><input class="pn" id="pname" maxlength="24" autocomplete="off" spellcheck="false" placeholder="输入玩家名"><button class="bt" id="pok" type="button">确认玩家名</button></div>
    <p class="pst" id="pst"></p>
  </section>

  <section class="glass lk" id="secPick">
    <h2 class="f" id="h-pick">选择效果</h2>
    <div id="groups"></div>
  </section>

  <section class="glass lk" id="secGen">
    <h2 class="f" id="h-gen">生成</h2>
    <div class="row">
      <div class="sel" id="selTxt"></div>
      <div class="qty"><button type="button" id="qm" aria-label="-">−</button><input id="qty" type="number" min="1" max="50" value="1" inputmode="numeric"><button type="button" id="qp" aria-label="+">+</button><span id="qlab">个</span></div>
      <button class="bt" id="go" type="button" disabled>生成作弊码</button>
    </div>
  </section>

  <section class="glass">
    <h2 class="f" id="h-res">本次结果</h2>
    <div id="codes" class="codes"></div>
    <div class="tools" id="tools" hidden>
      <button class="bt g" id="copyAll" type="button">复制全部</button>

      <button class="bt g" id="dlCsv" type="button">导出 CSV</button>
      <button class="bt g" id="clr" type="button">清空记录</button>
    </div>
    <p class="foot" id="foot"></p>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
(()=>{
'use strict';
/* ================= secret key (must match the game verifier) ================= */
const KEY_HEX='7d1f3b9a54c2e86017ab9d4e62f3c8150a9be7d24c6f81359ed0b3a74c18f62e';

/* ================= SHA-256 / HMAC (pure JS, no dependencies) ================= */
const K256=new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
function sha256(m){
  const l=m.length,nb=((l+9+63)>>6)<<6,b=new Uint8Array(nb);b.set(m);b[l]=0x80;
  const dv=new DataView(b.buffer);dv.setUint32(nb-8,Math.floor(l/0x20000000));dv.setUint32(nb-4,(l<<3)>>>0);
  let h0=0x6a09e667,h1=0xbb67ae85,h2=0x3c6ef372,h3=0xa54ff53a,h4=0x510e527f,h5=0x9b05688c,h6=0x1f83d9ab,h7=0x5be0cd19;
  const w=new Uint32Array(64),rr=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let o=0;o<nb;o+=64){
    for(let i=0;i<16;i++)w[i]=dv.getUint32(o+i*4);
    for(let i=16;i<64;i++){const a=w[i-15],c=w[i-2];w[i]=(w[i-16]+(rr(a,7)^rr(a,18)^(a>>>3))+w[i-7]+(rr(c,17)^rr(c,19)^(c>>>10)))>>>0}
    let a=h0,bb=h1,c=h2,d=h3,e=h4,f=h5,g=h6,h=h7;
    for(let i=0;i<64;i++){
      const t1=(h+(rr(e,6)^rr(e,11)^rr(e,25))+((e&f)^(~e&g))+K256[i]+w[i])>>>0;
      const t2=((rr(a,2)^rr(a,13)^rr(a,22))+((a&bb)^(a&c)^(bb&c)))>>>0;
      h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=bb;bb=a;a=(t1+t2)>>>0;
    }
    h0=(h0+a)>>>0;h1=(h1+bb)>>>0;h2=(h2+c)>>>0;h3=(h3+d)>>>0;h4=(h4+e)>>>0;h5=(h5+f)>>>0;h6=(h6+g)>>>0;h7=(h7+h)>>>0;
  }
  const out=new Uint8Array(32),ov=new DataView(out.buffer);[h0,h1,h2,h3,h4,h5,h6,h7].forEach((x,i)=>ov.setUint32(i*4,x));
  return out;
}
function hmac(key,msg){
  const blk=new Uint8Array(64);blk.set(key.length>64?sha256(key):key);
  const ip=blk.map(x=>x^0x36),op=blk.map(x=>x^0x5c);
  const a=new Uint8Array(64+msg.length);a.set(ip);a.set(msg,64);
  const ih=sha256(a),b=new Uint8Array(96);b.set(op);b.set(ih,64);return sha256(b);
}
const hex2u8=s=>Uint8Array.from(s.match(/../g).map(x=>parseInt(x,16)));
const u82hex=u=>[...u].map(x=>x.toString(16).padStart(2,'0')).join('');
const enc=s=>Uint8Array.from(s,c=>c.charCodeAt(0));
const KEY=hex2u8(KEY_HEX);
const KEY_FP=u82hex(sha256(KEY)).slice(0,8).toUpperCase();

/* ================= effects ================= */
// id is part of the code format: NEVER renumber existing entries.
const EFFECTS=[
 {id:1, g:'res',ic:'🪙',zh:'增加1万金币',en:'+10,000 Coins'},
 {id:2, g:'res',ic:'🪙',zh:'增加5万金币',en:'+50,000 Coins'},
 {id:3, g:'res',ic:'💰',zh:'增加10万金币',en:'+100,000 Coins'},
 {id:4, g:'res',ic:'💰',zh:'增加100万金币',en:'+1,000,000 Coins'},
 {id:5, g:'res',ic:'⭐',zh:'增加100个星星',en:'+100 Stars'},
 {id:6, g:'res',ic:'💎',zh:'增加100颗钻石',en:'+100 Diamonds'},
 {id:7, g:'res',ic:'💎',zh:'增加500颗钻石',en:'+500 Diamonds'},
 {id:8, g:'res',ic:'💎',zh:'增加1000颗钻石',en:'+1,000 Diamonds'},
 {id:9, g:'tow',ic:'⚡',zh:'防御塔建造速度全开',en:'Instant Tower Build'},
 {id:10,g:'tow',ic:'🛡️',zh:'防御塔无敌',en:'Invincible Towers'},
 {id:11,g:'tow',ic:'⚔️',zh:'防御塔攻击值 +25%',en:'Tower Attack +25%',stack:1},
 {id:12,g:'tow',ic:'🗡️',zh:'防御塔攻击值 +500%',en:'Tower Attack +500%',big:1},
 {id:13,g:'tow',ic:'🎯',zh:'防御塔暴击值 +25%',en:'Tower Crit +25%',stack:1},
 {id:14,g:'tow',ic:'💥',zh:'防御塔暴击值 +500%',en:'Tower Crit +500%',big:1},
 {id:15,g:'tow',ic:'🏰',zh:'防御塔防御值 +25%',en:'Tower Defense +25%',stack:1},
 {id:16,g:'map',ic:'🗝️',zh:'解锁所有关卡',en:'Unlock All Levels'},
 {id:17,g:'map',ic:'🌲',zh:'消除地图上所有自然障碍物',en:'Clear All Natural Obstacles'},
 {id:18,g:'btl',ic:'😈',zh:'怪物互相攻击',en:'Monsters Fight Each Other'},
 {id:19,g:'btl',ic:'⏱️',zh:'所有道具冷却时间归0',en:'Reset All Item Cooldowns'}
];
const GROUPS=[['res','资源','Resources'],['tow','防御塔','Towers'],['map','地图与关卡','Map & Levels'],['btl','战斗','Battle']];

/* ================= code generation (CK2, player-bound) ================= */
const B32='0123456789ABCDEFGHJKMNPQRSTVWXYZ';
function randByte(){const u=new Uint8Array(1);crypto.getRandomValues(u);return u[0]}
function bitsFromBytes(u,n){let v=0n;for(const x of u)v=(v<<8n)|BigInt(x);return v>>BigInt(u.length*8-n)}
const normName=n=>String(n).normalize('NFKC').replace(/\s+/g,' ').trim().toLowerCase();
const CODE_TTL=600;   // seconds a code stays valid (must match the game)
function makeCode(id,ts,sr,name){
  const nb8=new TextEncoder().encode('|'+normName(name)),msg=new Uint8Array(12+nb8.length);
  msg.set(enc('CK3|T|'));msg[6]=id;msg[7]=ts>>>24&255;msg[8]=ts>>>16&255;msg[9]=ts>>>8&255;msg[10]=ts&255;msg[11]=sr;msg.set(nb8,12);
  const tag=bitsFromBytes(hmac(KEY,msg),54);
  const tb=new Uint8Array(7);let t=tag;for(let i=6;i>=0;i--){tb[i]=Number(t&255n);t>>=8n}
  const mm=new Uint8Array(13);mm.set(enc('CK3|M|'));mm.set(tb,6);
  const mask=bitsFromBytes(hmac(KEY,mm),46);
  const P=(BigInt(id)<<40n)|(BigInt(ts)<<8n)|BigInt(sr);
  const all=((P^mask)<<54n)|tag;               // 100 bits
  let s='';for(let i=19;i>=0;i--)s+=B32[Number((all>>BigInt(i*5))&31n)];
  return s;
}
const fmt=s=>s.match(/.{4}/g).join('-');

/* ================= state / UI ================= */
let LANG=/^zh/i.test(navigator.language||'zh')?'zh':'en',sel=null,last=[],player=null,pmsg=null;
const $=id=>document.getElementById(id);
const T={
 zh:{lang:'🌐 EN',ttl:'作弊码生成器',sub:'确认玩家名 → 选择效果 → 设定数量 → 生成。每个码仅限该玩家使用，只能用一次，生成后 10 分钟内有效。',until:'有效至',left:'剩余',expired:'已失效',name:'玩家名',nameph:'输入玩家名（与游戏内一致）',nameok:'确认玩家名',namechg:'更换玩家名',nameLocked:'已锁定玩家名：',nameLocked2:' —— 生成的码只对这个玩家名有效。',nameEmpty:'请先输入玩家名',nameNeed:'请先确认玩家名',pick:'选择效果',gen:'生成',res:'本次结果',his:'生成记录',
  go:'生成作弊码',qty:'个',none:'请先在上方选择一个效果',picked:'已选：',stack:'可叠加',big:'超强',emptyRes:'还没有生成作弊码',emptyHis:'暂无记录',
  copy:'复制',copied:'已复制',copyAll:'复制全部',dl:'下载 TXT',csv:'导出 CSV',clr:'清空记录',clrQ:'确定清空全部生成记录？（已发出的作弊码不受影响）',cleared:'记录已清空',
  foot:'<b>说明：</b>码与玩家名绑定：玩家名不同，生成的码就不同，换名字的玩家无法兑换（比对时忽略大小写和多余空格）。每个码含随机序列号，同一效果每次生成的码都不同；码为 20 位，内含生成时间，经 HMAC-SHA256 签名，无法凭空猜出。<b>有效期 10 分钟</b>（以玩家设备系统时间为准，请保证两端时间大致一致）。<b>密钥指纹：</b>'+KEY_FP+'（游戏端校验器须使用同一密钥）。记录仅保存在本浏览器。'},
 en:{lang:'🌐 中文',ttl:'Cheat Code Generator',sub:'Confirm player name → pick an effect → set quantity → generate. Each code works for that player only, once, within 10 minutes of issue.',until:'valid until',left:'left',expired:'EXPIRED',name:'Player name',nameph:'Enter the in-game player name',nameok:'Confirm name',namechg:'Change name',nameLocked:'Player locked: ',nameLocked2:' — generated codes are valid for this name only.',nameEmpty:'Enter a player name first',nameNeed:'Confirm the player name first',pick:'Choose effect',gen:'Generate',res:'This batch',his:'History',
  go:'Generate codes',qty:'pcs',none:'Pick an effect above first',picked:'Selected: ',stack:'Stackable',big:'MEGA',emptyRes:'No codes generated yet',emptyHis:'No history yet',
  copy:'Copy',copied:'Copied',copyAll:'Copy all',dl:'Download TXT',csv:'Export CSV',clr:'Clear history',clrQ:'Clear all history? (Codes already issued are not affected.)',cleared:'History cleared',
  foot:'<b>Notes:</b> codes are bound to the player name: a different name yields different codes, and they will not redeem under another name (case and extra spaces are ignored). Every code carries a random serial, so codes for the same effect always differ; 20 chars, contains the issue time, HMAC-SHA256 signed, not guessable. <b>Valid for 10 minutes</b> (judged by the device clock of the player, so keep both clocks roughly in sync). <b>Key fingerprint:</b> '+KEY_FP+' (the game verifier must use the same key). History is stored in this browser only.'}
};
const t=k=>T[LANG][k];
const nm=e=>e[LANG];
let toastT=0;function toast(s){const e=$('toast');e.textContent=s;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),1400)}

function loadHist(){try{return JSON.parse(localStorage.getItem('ck_cheatgen_hist')||'[]')}catch(e){return[]}}
function saveHist(h){try{localStorage.setItem('ck_cheatgen_hist',JSON.stringify(h.slice(-2000)))}catch(e){}}
async function copyText(s){
  try{await navigator.clipboard.writeText(s);return true}catch(e){}
  try{const a=document.createElement('textarea');a.value=s;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();const ok=document.execCommand('copy');a.remove();return ok}catch(e){return false}
}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function renderGroups(){
  $('groups').innerHTML=GROUPS.map(([g,zh,en])=>`<div class="grp"><b class="f">${LANG==='zh'?zh:en}</b><div class="grid" role="radiogroup">${
    EFFECTS.filter(e=>e.g===g).map(e=>`<button type="button" class="opt" role="radio" aria-checked="${sel===e.id}" data-id="${e.id}"><span class="ic">${e.ic}</span><span class="tx">${esc(nm(e))}${e.stack?`<br><span class="tag">${t('stack')}</span>`:''}${e.big?`<br><span class="tag big">${t('big')}</span>`:''}</span></button>`).join('')
  }</div></div>`).join('');
}
function renderSel(){
  const e=EFFECTS.find(x=>x.id===sel);
  $('selTxt').innerHTML=e?t('picked')+'<b>'+esc(nm(e))+'</b>':t('none');
  $('go').disabled=!e;
}
function renderCodes(){
  const c=$('codes');
  if(!last.length){c.innerHTML=`<div class="empty">${t('emptyRes')}</div>`;$('tools').hidden=true;return}
  c.innerHTML=last.map((x,i)=>`<div class="code"><span class="v">${fmt(x.code)}</span><span class="n">${esc(nm(EFFECTS.find(e=>e.id===x.id)))}<br>${t('until')} ${hhmmss(x.ts+CODE_TTL)} · <b class="cd" data-exp="${x.ts+CODE_TTL}"></b></span><button class="bt g" type="button" data-copy="${i}">${t('copy')}</button></div>`).join('');
  $('tools').hidden=false;
}
function renderHist(){
  const h=loadHist().slice().reverse();
  $('hist').innerHTML=h.length?h.map((x,i)=>{const e=EFFECTS.find(z=>z.id===x.id);return `<div class="hrow"><span class="v">${fmt(x.code)}</span><span class="m">${esc(e?nm(e):'#'+x.id)} · 👤${esc(x.player||'-')} · ${new Date(x.at).toLocaleString()}${x.ts?' · '+t('until')+' '+hhmmss(x.ts+CODE_TTL)+' <b class="cd" data-exp="'+(x.ts+CODE_TTL)+'"></b>':''}</span><button class="bt g" type="button" data-hcopy="${esc(x.code)}">${t('copy')}</button></div>`}).join(''):`<div class="empty">${t('emptyHis')}</div>`;
}
function renderText(){
  document.documentElement.lang=LANG==='zh'?'zh-CN':'en';
  $('lang').textContent=t('lang');$('ttl').textContent=t('ttl');$('sub').textContent=t('sub');
  $('h-name').textContent=t('name');$('pname').placeholder=t('nameph');$('h-pick').textContent=t('pick');$('h-gen').textContent=t('gen');$('h-res').textContent=t('res');$('h-his').textContent=t('his');
  $('go').textContent=t('go');$('qlab').textContent=t('qty');$('copyAll').textContent=t('copyAll');$('dlTxt').textContent=t('dl');
  $('dlCsv').textContent=t('csv');$('clr').textContent=t('clr');$('foot').innerHTML=t('foot');document.title=(LANG==='zh'?'混沌王国 · ':'Chaos Kingdoms · ')+t('ttl');
  renderGroups();renderSel();renderCodes();renderHist();renderPlayer();tick();
}
function renderPlayer(){
  const ok=!!player,st=$('pst');
  $('pname').disabled=ok;$('pok').textContent=ok?t('namechg'):t('nameok');
  $('secPick').classList.toggle('locked-off',!ok);$('secGen').classList.toggle('locked-off',!ok);
  if(ok){st.className='pst ok';st.textContent='✓ '+t('nameLocked')+player+t('nameLocked2')}
  else if(pmsg){st.className='pst bad';st.textContent=t(pmsg)}
  else{st.className='pst';st.textContent=t('nameNeed')}
}

function clampQty(){let v=Math.round(+$('qty').value||1);v=Math.max(1,Math.min(50,v));$('qty').value=v;return v}
function generate(){
  if(!sel||!player)return;const n=clampQty();
  const hist=loadHist(),used=new Set(hist.map(x=>x.code)),batch=[],now=Date.now(),ts=Math.floor(now/1000);
  while(batch.length<n){
    const code=makeCode(sel,ts,randByte(),player);
    if(used.has(code))continue;used.add(code);
    batch.push({code,id:sel,at:now,ts,player});
  }
  hist.push(...batch);saveHist(hist);last=batch;renderCodes();renderHist();tick();
}
const hhmmss=sec=>new Date(sec*1000).toLocaleTimeString([],{hour12:false});
function tick(){
  const now=Date.now()/1000;
  document.querySelectorAll('.cd').forEach(el=>{
    const left=Math.ceil(+el.dataset.exp-now);
    if(left>0){el.textContent=t('left')+' '+Math.floor(left/60)+':'+String(left%60).padStart(2,'0');el.style.color=left<=60?'var(--bad)':'var(--ok)'}
    else{el.textContent=t('expired');el.style.color='var(--bad)'}
  });
}
setInterval(tick,1000);

$('groups').addEventListener('click',ev=>{const b=ev.target.closest('.opt');if(!b)return;sel=+b.dataset.id;
  document.querySelectorAll('.opt').forEach(o=>o.setAttribute('aria-checked',String(+o.dataset.id===sel)));renderSel()});
$('qm').onclick=()=>{$('qty').value=clampQty()-1;clampQty()};
$('qp').onclick=()=>{$('qty').value=clampQty()+1;clampQty()};
$('qty').addEventListener('change',clampQty);
$('go').onclick=generate;
$('codes').addEventListener('click',async ev=>{const b=ev.target.closest('[data-copy]');if(!b)return;toast(await copyText(last[+b.dataset.copy].code)?t('copied'):'×')});
$('hist').addEventListener('click',async ev=>{const b=ev.target.closest('[data-hcopy]');if(!b)return;toast(await copyText(b.dataset.hcopy)?t('copied'):'×')});
$('copyAll').onclick=async()=>toast(await copyText(last.map(x=>x.code).join('\n'))?t('copied'):'×');
$('dlTxt').onclick=()=>{const e=EFFECTS.find(x=>x.id===last[0].id);download('ck-codes-'+Date.now()+'.txt',last.map(x=>fmt(x.code)+'\t'+nm(e)+'\t'+x.player+'\t'+new Date((x.ts+CODE_TTL)*1000).toLocaleString()).join('\r\n'),'text/plain')};
$('dlCsv').onclick=()=>{const h=loadHist();download('ck-code-history.csv','code,player,effect_id,effect,generated_at,expires_at\r\n'+h.map(x=>{const e=EFFECTS.find(z=>z.id===x.id);return [x.code,'"'+String(x.player||'').replace(/"/g,'""')+'"',x.id,'"'+(e?e.zh:'')+'"',new Date(x.at).toISOString(),x.ts?new Date((x.ts+CODE_TTL)*1000).toISOString():''].join(',')}).join('\r\n'),'text/csv')};
$('clr').onclick=()=>{if(confirm(t('clrQ'))){saveHist([]);renderHist();toast(t('cleared'))}};
function confirmName(){
  if(player){player=null;last=[];pmsg=null;renderPlayer();renderCodes();$('pname').focus();return}
  const raw=$('pname').value.replace(/\s+/g,' ').trim();
  if(!normName(raw)){pmsg='nameEmpty';renderPlayer();return}
  player=raw;pmsg=null;last=[];renderPlayer();renderCodes();
}
$('pok').onclick=confirmName;
$('pname').addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();if(!player)confirmName()}});
$('lang').onclick=()=>{LANG=LANG==='zh'?'en':'zh';renderText()};

window.__ck={makeCode,EFFECTS,randByte};   // test hook only; read-only helpers, no verifier
renderText();
})();
</script>
</body>
